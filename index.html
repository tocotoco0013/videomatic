<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videomatic</title>
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#14182b;--mute:#667089;--line:#dde2ee;--acc:#3b4bff;--acc2:#ffd23f;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0e1120;--panel:#171b30;--ink:#eef0fa;--mute:#98a1c0;--line:#2a3050;--acc:#8a95ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans JP","Hiragino Sans",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;padding:10px 20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--acc);position:relative}
.logo i:after{content:"";position:absolute;left:10px;top:7px;border:6px solid transparent;border-left:10px solid var(--acc2);border-right:0}
form.s{flex:1;min-width:240px;display:flex;max-width:640px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:9px 14px;outline:none}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
form.s input{flex:1;border-radius:999px 0 0 999px}
button{font:inherit;cursor:pointer;border:0;background:var(--acc);color:#fff;padding:9px 18px;font-weight:600}
form.s button{border-radius:0 999px 999px 0}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px}
nav{display:flex;gap:4px}
nav button{background:transparent;color:var(--mute);border-radius:999px}
nav button.on{background:var(--ink);color:var(--bg)}
main{max-width:1200px;margin:0 auto;padding:20px}
.view{display:none}.view.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit}
.card:hover{border-color:var(--acc)}
.th{aspect-ratio:16/9;background:var(--line);position:relative}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th b{position:absolute;right:6px;bottom:6px;background:#000c;color:#fff;font-size:12px;padding:1px 6px;border-radius:5px;font-weight:500}
.card div.t{padding:10px 12px 12px}
.card h3{margin:0 0 4px;font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p{margin:0;color:var(--mute);font-size:12.5px}
.player{background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9}
.player iframe{width:100%;height:100%;border:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bar .sp{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:720px}
.panel h2{margin:0 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.row input{flex:1;min-width:200px;border-radius:10px}
.row button{border-radius:10px}
label{display:block;margin:14px 0 4px;font-weight:600;font-size:13px}
.note{color:var(--mute);font-size:13px}
.msg{padding:30px;text-align:center;color:var(--mute)}
.err{color:#d6336c}
#dlPrev img{max-width:100%;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>Videomatic</div>
  <form class="s" id="sf"><input id="q" type="search" placeholder="動画を検索" autocomplete="off"><button>検索</button></form>
  <nav>
    <button data-v="home" class="on">検索</button>
    <button data-v="watch">視聴</button>
    <button data-v="dl">ダウンロード</button>
    <button data-v="set">設定</button>
  </nav>
</header>

<main>
  <section class="view on" id="v-home">
    <div id="results" class="grid"></div>
    <div id="status" class="msg">キーワードを入力して動画を検索してください。<br>動画IDまたはURLを貼り付けても再生できます。</div>
  </section>

  <section class="view" id="v-watch">
    <div class="player" id="player"></div>
    <div class="bar">
      <strong id="wtitle">動画が選択されていません</strong><span class="sp"></span>
      <select id="host" aria-label="再生ホスト">
        <option value="https://www.youtube-nocookie.com">youtube-nocookie.com</option>
        <option value="https://www.youtubeeducation.com">youtubeeducation.com</option>
      </select>
      <button class="ghost" id="toDl">この動画のIDでダウンロード画面へ</button>
    </div>
  </section>

  <section class="view" id="v-dl">
    <div class="panel">
      <h2>ダウンロード</h2>
      <p class="note">動画IDまたはURLを入力してください。</p>
      <div class="row"><input id="dlId" placeholder="例: dQw4w9WgXcQ"><button id="dlGo">ダウンロード</button></div>
      <div id="dlPrev"></div>
      <p class="note" id="dlNote"></p>
    </div>
  </section>

  <section class="view" id="v-set">
    <div class="panel">
      <h2>設定</h2>
      <label for="inst">検索サーバー(Invidiousインスタンス、1行に1つ)</label>
      <textarea id="inst" rows="4" style="width:100%;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px"></textarea>
      <label for="dlsrv">ダウンロードサーバーのURL(自分で用意したAPI)</label>
      <input id="dlsrv" style="width:100%;border-radius:10px" placeholder="https://your-server.example/download">
      <p class="note">ダウンロード時に <code>URL?id=動画ID</code> へ移動します。検索サーバーは上から順に試し、失敗したら次を使います。</p>
      <div class="row"><button id="save">保存</button></div>
    </div>
  </section>
</main>

<script>
const $=s=>document.querySelector(s);
const DEF_INST=["https://yewtu.be","https://inv.nadeko.net","https://invidious.nerdvpn.de"];
const store={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const thumb=(id,w=480)=>`https://wsrv.nl/?url=${encodeURIComponent(`https://i.ytimg.com/vi/${id}/hqdefault.jpg`)}&w=${w}&output=webp`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>{s=+s||0;const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const parseId=t=>{t=t.trim();const m=t.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(t)?t:null)};

function show(v){document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on",e.id==="v-"+v));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));

const insts=()=>store.get("vm_inst",DEF_INST.join("\n")).split("\n").map(s=>s.trim().replace(/\/$/,"")).filter(Boolean);

async function search(q){
  const st=$("#status"),res=$("#results");
  res.innerHTML="";st.className="msg";st.textContent="検索中…";
  for(const base of insts()){
    try{
      const r=await fetch(`${base}/api/v1/search?q=${encodeURIComponent(q)}&type=video`,{signal:AbortSignal.timeout(8000)});
      if(!r.ok)continue;
      const data=(await r.json()).filter(x=>x.type==="video");
      if(!data.length){st.textContent="見つかりませんでした。別のキーワードを試してください。";return}
      st.textContent="";
      res.innerHTML=data.map(v=>`<button class="card" data-id="${esc(v.videoId)}" data-t="${esc(v.title)}">
        <div class="th"><img loading="lazy" src="${thumb(v.videoId)}" alt=""><b>${fmt(v.lengthSeconds)}</b></div>
        <div class="t"><h3>${esc(v.title)}</h3><p>${esc(v.author)} ・ ${esc(v.viewCountText||"")}</p></div></button>`).join("");
      res.querySelectorAll(".card").forEach(c=>c.onclick=()=>play(c.dataset.id,c.dataset.t));
      return;
    }catch(e){}
  }
  st.className="msg err";st.textContent="検索サーバーに接続できません。設定でインスタンスを変更してください。";
}

let cur=null;
function play(id,title){
  cur=id;
  $("#player").innerHTML=`<iframe src="${$("#host").value}/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  $("#wtitle").textContent=title||id;
  show("watch");scrollTo(0,0);
}
$("#host").onchange=()=>{if(cur)play(cur,$("#wtitle").textContent)};
$("#toDl").onclick=()=>{if(cur){$("#dlId").value=cur;previewDl();show("dl")}};

$("#sf").onsubmit=e=>{e.preventDefault();const t=$("#q").value.trim();if(!t)return;
  const id=parseId(t);if(id&&/youtu|^[\w-]{11}$/.test(t)&&!/\s/.test(t)){play(id);return}
  show("home");search(t)};

function previewDl(){const id=parseId($("#dlId").value);
  $("#dlPrev").innerHTML=id?`<img src="${thumb(id,640)}" alt="サムネイル">`:"";return id}
$("#dlId").oninput=previewDl;
$("#dlGo").onclick=()=>{
  const id=previewDl(),n=$("#dlNote");n.className="note";
  if(!id){n.className="note err";n.textContent="11文字の動画IDまたはYouTubeのURLを入力してください。";return}
  const srv=store.get("vm_dl","");
  if(!srv){n.className="note err";n.textContent="設定でダウンロードサーバーのURLを入力してください。";show("set");return}
  n.textContent="ダウンロードを開始します…";
  location.href=`${srv}${srv.includes("?")?"&":"?"}id=${id}`;
};

$("#inst").value=insts().join("\n");$("#dlsrv").value=store.get("vm_dl","");
$("#save").onclick=()=>{store.set("vm_inst",$("#inst").value);store.set("vm_dl",$("#dlsrv").value.trim());$("#save").textContent="保存しました";setTimeout(()=>$("#save").textContent="保存",1500)};
</script>
</body>
</html>
